services:
  netsapiens-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: netsapiens-mcp:latest
    container_name: netsapiens-mcp
    ports:
      - "${MCP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_PORT=3000
      - MCP_PERSISTENCE=sqlite
      # MCP_SESSION_SECRET (>= 32 chars) is required and must be supplied via .env.
      # NETSAPIENS_API_URL and OAuth client credentials are also supplied via .env.
    # SQLite uses an exclusive file lock. Each container must use its own dedicated volume;
    # do not mount a single volume across multiple concurrent containers.
    volumes:
      - token-data:/home/nodejs/.netsapiens-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  token-data:
