# Cloud Build pipeline for the NetSapiens MCP server.
#
# Triggered automatically by pushes to `main` (Cloud Build GitHub trigger
# in the phoneware-edge project). Runs the test suite, builds the image,
# pushes it to Artifact Registry, and deploys to Cloud Run.
#
# IMPORTANT — env vars are managed OUTSIDE this file. The deploy step does
# NOT pass --set-env-vars, so Cloud Run inherits all env vars from the
# previous active revision (MCP_SESSION_SECRET, NETSAPIENS_OAUTH_CLIENT_*,
# MCP_PERSISTENCE=firestore, MCP_TOOL_MODE=curated, MCP_LOGIN_HEADER,
# MCP_ICON_URL, MCP_DISABLED_TOOLS, etc.). To change a production env var,
# update the service directly:
#   gcloud run services update netsapiens-mcp \
#     --region=us-central1 --update-env-vars="KEY=value"
# Adding --set-env-vars here would wipe every existing env var on the next
# deploy, including the secrets needed for users to log in.

steps:
  # 1. Install dependencies and run the test suite. A red suite must fail
  #    the build before we touch production. The Firestore tests are
  #    emulator-gated and skip cleanly without one.
  - id: test
    name: 'node:18-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        apk add --no-cache git
        npm ci
        npm test

  # 2. Build the production container image (commit-sha tag + latest).
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:latest'
      - '.'

  # 3. Push both tags.
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp'

  # 4. Deploy the new image to Cloud Run. No --set-env-vars: env vars
  #    carry over from the currently-serving revision.
  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'netsapiens-mcp'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=3000'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--session-affinity'

  # 5. Deploy the read-only service to Cloud Run. Self-sufficient on first
  #    deploy; subsequent deploys inherit env vars like the main service.
  - id: deploy-readonly
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push']
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if ! gcloud run services describe netsapiens-mcp-readonly --region=${_REGION} > /dev/null 2>&1; then
          echo "Deploying netsapiens-mcp-readonly for the first time..."
          gcloud run deploy netsapiens-mcp-readonly \
            --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA \
            --region=${_REGION} \
            --platform=managed \
            --port=3000 \
            --allow-unauthenticated \
            --service-account=859122914438-compute@developer.gserviceaccount.com \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity \
            --set-env-vars="MCP_TRANSPORT=http,MCP_PORT=3000,NODE_ENV=production,MCP_BASE_URL=https://mcp-readonly.edge.phoneware.cloud,NETSAPIENS_API_URL=https://edge.phoneware.cloud,NETSAPIENS_OAUTH_CLIENT_ID=phoneware-edge-mcp,NETSAPIENS_OAUTH_CLIENT_SECRET=b33d344b36b978fa0621752642b1bee6,MCP_LOGIN_HEADER=Login to Phoneware EDGE (Read-Only),MCP_DISABLED_TOOLS=delete_*,remove_*,MCP_DISABLED_ACTIONS=delete,remove,revoke,destroy,delete_definition,MCP_SESSION_SECRET=524eb2f51ca3b1322330721ce130c6e3cc4fe4a8704a5f1309c08a11a4438218,MCP_ICON_URL=https://phoneware.us/images/phoneware-icon-800x800.png,MCP_PERSISTENCE=firestore,GOOGLE_CLOUD_PROJECT=phoneware-edge,MCP_TOOL_MODE=curated,MCP_READ_ONLY=true"
        else
          echo "Updating netsapiens-mcp-readonly image..."
          gcloud run deploy netsapiens-mcp-readonly \
            --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA \
            --region=${_REGION} \
            --platform=managed \
            --port=3000 \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --timeout=3600 \
            --session-affinity
        fi

substitutions:
  _REGION: us-central1
  _REPO: netsapiens-mcp

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
