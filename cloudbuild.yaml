# Cloud Build pipeline for the NetSapiens MCP server.
#
# Triggered automatically by pushes to `main` (Cloud Build GitHub trigger
# in the phoneware-edge project). Runs the test suite, builds the image,
# pushes it to Artifact Registry, and deploys to Cloud Run.
#
# Configuration is managed in this pipeline so every deployment is
# reproducible. Non-secret env vars are configured via --update-env-vars.
# Secrets are referenced securely from Secret Manager via --update-secrets.

steps:
  # 1. Install dependencies and run the test suite. A red suite must fail
  #    the build before we touch production. The Firestore tests are
  #    emulator-gated and skip cleanly without one.
  - id: test
    name: 'node:18-alpine'
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        apk add --no-cache git
        npm ci
        npm test

  # 2. Build the production container image (commit-sha tag + latest).
  - id: build
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['test']
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:latest'
      - '.'

  # 3. Push both tags.
  - id: push
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['build']
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp'

  # 4. Deploy the production service to Cloud Run.
  - id: deploy
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'netsapiens-mcp'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=3000'
      - '--allow-unauthenticated'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--session-affinity'
      - '--remove-env-vars=NETSAPIENS_OAUTH_CLIENT_SECRET,MCP_SESSION_SECRET'
      - '--update-env-vars=^;;^MCP_TRANSPORT=http;;MCP_PORT=3000;;NODE_ENV=production;;MCP_BASE_URL=https://mcp.edge.phoneware.cloud;;NETSAPIENS_API_URL=https://edge.phoneware.cloud;;NETSAPIENS_OAUTH_CLIENT_ID=${_NETSAPIENS_OAUTH_CLIENT_ID};;MCP_LOGIN_HEADER=Login to Phoneware EDGE;;MCP_DISABLED_TOOLS=delete_*,remove_*;;MCP_DISABLED_ACTIONS=delete,remove,revoke,destroy,delete_definition;;MCP_ICON_URL=https://phoneware.us/images/phoneware-icon-800x800.png;;MCP_PERSISTENCE=firestore;;GOOGLE_CLOUD_PROJECT=phoneware-edge;;MCP_TOOL_MODE=curated;;NETSAPIENS_PLATFORMS=Edge=https://edge.phoneware.cloud,Viirtue=https://vps.phoneware.us,MCU=https://mars.phoneware.cloud'
      - '--update-secrets=MCP_SESSION_SECRET=netsapiens-mcp-session-secret:latest,NETSAPIENS_OAUTH_CLIENT_SECRET=netsapiens-mcp-oauth-client-secret:latest'

  # 5. Deploy the read-only service to Cloud Run.
  - id: deploy-readonly
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    waitFor: ['push']
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'netsapiens-mcp-readonly'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--port=3000'
      - '--allow-unauthenticated'
      - '--service-account=859122914438-compute@developer.gserviceaccount.com'
      - '--min-instances=1'
      - '--max-instances=10'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--timeout=3600'
      - '--session-affinity'
      - '--remove-env-vars=NETSAPIENS_OAUTH_CLIENT_SECRET,MCP_SESSION_SECRET'
      - '--update-env-vars=^;;^MCP_TRANSPORT=http;;MCP_PORT=3000;;NODE_ENV=production;;MCP_BASE_URL=https://mcp-readonly.edge.phoneware.cloud;;NETSAPIENS_API_URL=https://edge.phoneware.cloud;;NETSAPIENS_OAUTH_CLIENT_ID=${_NETSAPIENS_OAUTH_CLIENT_ID};;MCP_LOGIN_HEADER=Login to Phoneware EDGE (Read-Only);;MCP_DISABLED_TOOLS=delete_*,remove_*;;MCP_DISABLED_ACTIONS=delete,remove,revoke,destroy,delete_definition;;MCP_ICON_URL=https://phoneware.us/images/phoneware-icon-800x800.png;;MCP_PERSISTENCE=firestore;;GOOGLE_CLOUD_PROJECT=phoneware-edge;;MCP_TOOL_MODE=curated;;NETSAPIENS_PLATFORMS=Edge=https://edge.phoneware.cloud,Viirtue=https://vps.phoneware.us,MCU=https://mars.phoneware.cloud;;MCP_READ_ONLY=true'
      - '--update-secrets=MCP_SESSION_SECRET=netsapiens-mcp-readonly-session-secret:latest,NETSAPIENS_OAUTH_CLIENT_SECRET=netsapiens-mcp-oauth-client-secret:latest'

substitutions:
  _REGION: us-central1
  _REPO: netsapiens-mcp
  _NETSAPIENS_OAUTH_CLIENT_ID: phoneware-edge-mcp

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/netsapiens-mcp:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
