name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify npm version
        run: |
          node -e '
            import { execSync } from "node:child_process";
            const version = execSync("npm --version", { encoding: "utf8" }).trim();
            const [major, minor, patch] = version.split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              console.error("npm >= 11.5.1 required for trusted publishing, got " + version);
              process.exit(1);
            }
            console.log("npm version " + version + " satisfies >= 11.5.1");
          '
      - run: npm ci
      # The Firestore store tests skip without an emulator; a release must run them.
      - name: Start Firestore emulator
        run: |
          docker run -d --name fs-emu -p 8080:8080 gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud emulators firestore start --host-port=0.0.0.0:8080
          for _ in $(seq 1 60); do curl -sf http://localhost:8080 >/dev/null && exit 0; sleep 2; done
          docker logs fs-emu; exit 1
      - name: Run tests
        run: npm test
        env:
          NSMCP_REQUIRE_FIRESTORE_EMULATOR: '1'
          FIRESTORE_EMULATOR_HOST: localhost:8080
          GOOGLE_CLOUD_PROJECT: firestore-test
      - run: npm run build
      - name: Pack package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TARBALL="netsapiens-mcp-${VERSION}.tgz"
          npm pack
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
      - name: Verify package contents
        run: node scripts/verify-pack.mjs "$TARBALL"
      - name: Scan package
        env:
          FORBIDDEN_CONTENT_PATTERNS: ${{ secrets.FORBIDDEN_CONTENT_PATTERNS }}
        run: node scripts/scan-forbidden.mjs --pack "$TARBALL"
      - name: Publish to npm
        run: |
          case "$VERSION" in
            *-*) npm publish "$TARBALL" --access public --tag next ;;
            *) npm publish "$TARBALL" --access public ;;
          esac
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$TARBALL" --title "$GITHUB_REF_NAME" --notes-file <(node scripts/changelog-section.mjs "$VERSION")
