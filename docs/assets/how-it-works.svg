<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="An AI client connects to the NetSapiens MCP Server, which calls the NetSapiens API as the signed-in user">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 22px; font-weight: 700; }
    .sub { font-size: 15px; }
    .lbl { font-size: 14px; font-weight: 600; fill: #475569; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect x="10" y="50" width="240" height="140" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="106" text-anchor="middle" class="title" fill="#0f172a">AI client</text>
  <text x="130" y="136" text-anchor="middle" class="sub" fill="#475569">Claude</text>
  <text x="130" y="158" text-anchor="middle" class="sub" fill="#475569">ChatGPT</text>
  <text x="130" y="180" text-anchor="middle" class="sub" fill="#475569">any MCP client</text>

  <rect x="380" y="30" width="240" height="180" rx="18" fill="url(#g)"/>
  <text x="500" y="92" text-anchor="middle" class="title" fill="#fff">NetSapiens MCP</text>
  <text x="500" y="128" text-anchor="middle" class="sub" fill="#e0f2fe">Browser sign-in, MFA</text>
  <text x="500" y="152" text-anchor="middle" class="sub" fill="#e0f2fe">Role-aware tools</text>
  <text x="500" y="176" text-anchor="middle" class="sub" fill="#e0f2fe">Version-aware routes</text>

  <rect x="750" y="50" width="240" height="140" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="870" y="106" text-anchor="middle" class="title" fill="#0f172a">NetSapiens</text>
  <text x="870" y="136" text-anchor="middle" class="sub" fill="#475569">v1 and v2 API</text>
  <text x="870" y="158" text-anchor="middle" class="sub" fill="#475569">Your own host</text>
  <text x="870" y="180" text-anchor="middle" class="sub" fill="#475569">44.3 through 46.0</text>

  <line x1="260" y1="124" x2="370" y2="124" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <line x1="630" y1="124" x2="740" y2="124" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/>
  <text x="315" y="110" text-anchor="middle" class="lbl">OAuth 2.1</text>
  <text x="685" y="110" text-anchor="middle" class="lbl">as the user</text>
</svg>
